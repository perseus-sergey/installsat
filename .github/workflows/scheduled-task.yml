name: Scheduled Task

on:
  schedule:
    - cron: '30 5 * * 1' # кожного понеділка о 5:30 ранку
  workflow_dispatch: # дозволяє запускати вручну через інтерфейс GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get CSRF Token
        id: get-csrf
        run: |
          # Зробимо запит до сторінки і виведемо її частину для перевірки
          page_content=$(curl -c cookies.txt -s https://installsat.fun/login)
          echo "$page_content" | head -n 50  # Виведемо перші 50 рядків сторінки
          # Спробуємо витягти CSRF токен з форми
          csrf_token=$(echo "$page_content" | grep -oP '(?<=name="csrf-token" value=")[^"]+')
          echo "CSRF Token: $csrf_token"
          echo "::set-output name=csrf_token::$csrf_token"

      - name: Authenticate and Get Token
        id: auth
        run: |
          response=$(curl -X POST https://installsat.fun/api/auth/callback/credentials \
            -H "Content-Type: application/json" \
            -H "X-CSRF-Token: ${{ steps.get-csrf.outputs.csrf_token }}" \
            -d "{\"login-email\": \"${{ secrets.LOGIN_EMAIL }}\", \"login-password\": \"${{ secrets.LOGIN_PASSWORD }}\"}" \
            -b cookies.txt -v) # додаємо -v для детального виводу
          echo "Server Response: $response"
          token=$(echo $response | jq -r '.token')
          if [[ "$token" == "null" ]]; then
            echo "Authentication failed. Token not received."
            exit 1
          fi
          echo "::set-output name=token::$token"

      - name: Call Parse Script
        run: |
          curl -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" -X GET  https://installsat.fun/guru/parse/trans-news
