name: Deploy

# Trigger the workflow on push and
# pull request events on the main branch
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Authenticate to the server via SSH
# and run our deployment script
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          # Виконати команду 'chmod' для надання дозволів на виконання
          pre_commands: |
            chmod +x ~/installsat/.scripts/deploy.sh
          script: 'cd ~/installsat && ./.scripts/deploy.sh'
