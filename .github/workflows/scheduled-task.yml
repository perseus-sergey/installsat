name: Scheduled Task

on:
  schedule:
    - cron: '30 5 * * 1' # кожного понеділка о 5:30 ранку
  workflow_dispatch: # дозволяє запускати вручну через інтерфейс GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get OAuth Token
        id: oauth
        run: echo "::set-output name=token::${{ secrets.OAUTH_TOKEN }}"

      - name: Call Parse Script
        run: |
          token="${{ steps.oauth.outputs.token }}"
          curl -H "Authorization: Bearer $token" -X GET https://installsat.fun/guru/parse/trans-news
